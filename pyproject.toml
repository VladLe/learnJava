[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "news-rewriter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2,<5.0",
    "django-environ>=0.11",
    "django-encrypted-model-fields>=0.6",
    "django-apscheduler>=0.6",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "httpx>=0.27",
    "whitenoise>=6.7",
    "anthropic>=0.28",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]
prod = [
    "gunicorn>=22.0",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "newsroom*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["newsroom"]
omit = ["*/migrations/*", "*/management/*"]

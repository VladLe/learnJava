services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsroom}
      POSTGRES_USER: ${POSTGRES_USER:-newsroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsroom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsroom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  scheduler:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
